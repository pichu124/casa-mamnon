<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1020" font-family="Segoe UI, Arial, sans-serif">
  <!--
    Sơ đồ triển khai SchoolConnect — PHƯƠNG ÁN B: thuê VPS, máy ở trường chỉ giữ
    bản sao lưu. Là nguồn của hình trong docs/QUY-TRINH-TRIEN-KHAI.docx — sửa ở
    đây rồi chạy `npm run tai-lieu:quy-trinh`.
    Mũi tên liền = luồng hằng ngày, tự động. Mũi tên đứt = định kỳ / khi có việc.
  -->
  <defs>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1560" height="1020" fill="#ffffff"/>

  <!-- ============ VÙNG VPS ============ -->
  <rect x="40" y="40" width="760" height="600" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="70" y="78" font-size="21" font-weight="bold" fill="#312e81">VPS THUÊ — Ubuntu Linux, chạy 24/7</text>
  <text x="70" y="102" font-size="13.5" fill="#3730a3">ưu tiên trung tâm dữ liệu đặt tại Việt Nam · 1–2GB RAM là đủ cho 300 học sinh</text>

  <rect x="70" y="118" width="700" height="170" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="90" y="146" font-size="16" font-weight="bold" fill="#1e1b4b">Dịch vụ systemd</text>
  <text x="255" y="146" font-size="13.5" fill="#3730a3">tự chạy khi VPS khởi động · Restart=always khi gặp sự cố</text>
  <rect x="100" y="160" width="640" height="110" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2.2"/>
  <text x="122" y="194" font-size="17" font-weight="bold" fill="#1e1b4b">SchoolConnect — Node.js dòng 22 · cổng 3000 (chỉ nội bộ)</text>
  <text x="122" y="220" font-size="13.5" fill="#475569">NODE_ENV=production · FORCE_HTTPS=1 · chặn dò mật khẩu</text>
  <text x="122" y="242" font-size="13.5" fill="#475569">cài đặt: /opt/schoolconnect — cập nhật bằng git pull qua SSH</text>

  <rect x="440" y="320" width="330" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="350" font-size="16" font-weight="bold" fill="#14532d">Caddy — cổng 443 (HTTPS)</text>
  <text x="460" y="375" font-size="13" fill="#475569">nhận tên miền của trường, tự xin và</text>
  <text x="460" y="395" font-size="13" fill="#475569">tự gia hạn chứng chỉ — không phải làm gì</text>
  <text x="460" y="424" font-size="12.5" font-style="italic" fill="#166534">tường lửa chỉ mở 22 (SSH), 80, 443</text>
  <line x1="580" y1="316" x2="580" y2="274" stroke="#334155" stroke-width="2.2" marker-end="url(#mb)"/>
  <text x="592" y="300" font-size="12.5" fill="#475569">chuyển tiếp nội bộ → cổng 3000</text>

  <rect x="70" y="320" width="330" height="120" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="90" y="350" font-size="16" font-weight="bold" fill="#713f12">/var/lib/schoolconnect</text>
  <text x="90" y="375" font-size="13" fill="#57534e">school.db — toàn bộ dữ liệu (SQLite)</text>
  <text x="90" y="395" font-size="13" fill="#57534e">uploads/ — ảnh album</text>
  <text x="90" y="424" font-size="12.5" font-style="italic" fill="#92400e">ngoài thư mục mã nguồn — git pull không đụng tới</text>
  <line x1="220" y1="274" x2="220" y2="316" stroke="#334155" stroke-width="2" marker-end="url(#mb)"/>
  <text x="232" y="300" font-size="12.5" fill="#475569">đọc / ghi</text>

  <rect x="70" y="480" width="330" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="90" y="508" font-size="15" font-weight="bold" fill="#0f172a">cron — 02:00 hằng đêm</text>
  <text x="90" y="532" font-size="13" fill="#475569">npm run backup (docs/SAO-LUU.md)</text>

  <rect x="440" y="480" width="330" height="76" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="460" y="508" font-size="15" font-weight="bold" fill="#064e3b">/var/lib/schoolconnect/backups</text>
  <text x="460" y="532" font-size="13" fill="#475569">tự giữ vòng đời 7 ngày · 4 tuần · 12 tháng</text>
  <line x1="404" y1="518" x2="436" y2="518" stroke="#334155" stroke-width="2" marker-end="url(#mb)"/>
  <text x="70" y="596" font-size="13" font-style="italic" fill="#312e81">SSH chỉ đăng nhập bằng KHÓA (tắt mật khẩu) · bật cập nhật bảo mật tự động (unattended-upgrades)</text>

  <!-- ============ NGƯỜI DÙNG QUA INTERNET ============ -->
  <rect x="850" y="40" width="670" height="250" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="880" y="78" font-size="21" font-weight="bold" fill="#064e3b">NGƯỜI DÙNG — Ở BẤT KỲ ĐÂU, QUA INTERNET</text>

  <rect x="880" y="98" width="290" height="94" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
  <text x="900" y="128" font-size="15.5" font-weight="bold" fill="#0f172a">Giáo viên</text>
  <text x="900" y="152" font-size="13" fill="#475569">Wi-Fi trường hay 4G đều được —</text>
  <text x="900" y="172" font-size="13" fill="#475569">điểm danh, nhận xét, duyệt xin phép</text>

  <rect x="1200" y="98" width="290" height="94" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
  <text x="1220" y="128" font-size="15.5" font-weight="bold" fill="#0f172a">Phụ huynh (4G tại nhà)</text>
  <text x="1220" y="152" font-size="13" fill="#475569">app PWA — dùng được ngay từ</text>
  <text x="1220" y="172" font-size="13" fill="#475569">ngày đầu, không cần giai đoạn thêm</text>

  <text x="880" y="232" font-size="14" font-weight="bold" fill="#065f46">https://lienlac.truong-cua-ban.vn</text>
  <text x="880" y="256" font-size="13" font-style="italic" fill="#475569">một địa chỉ duy nhất, có ổ khóa trình duyệt — in địa chỉ này lên phiếu tài khoản</text>
  <path d="M 846 200 L 823 200 L 823 380 L 774 380" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#mb)"/>
  <text x="806" y="368" font-size="12" fill="#475569">:443</text>

  <!-- ============ MÁY Ở TRƯỜNG ============ -->
  <rect x="850" y="330" width="670" height="240" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="880" y="368" font-size="21" font-weight="bold" fill="#78350f">MÁY Ở TRƯỜNG (Windows) — CHỈ MỘT VAI TRÒ: KHO DỰ PHÒNG</text>

  <rect x="880" y="390" width="290" height="100" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <text x="900" y="420" font-size="15" font-weight="bold" fill="#0f172a">Task Scheduler — 03:00</text>
  <text x="900" y="444" font-size="13" fill="#475569">keo-sao-luu.bat: kéo thư mục</text>
  <text x="900" y="464" font-size="13" fill="#475569">backups từ VPS về qua SSH (scp)</text>

  <rect x="1200" y="390" width="290" height="100" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <text x="1220" y="420" font-size="15" font-weight="bold" fill="#0f172a">C:\SchoolConnectBackup</text>
  <text x="1220" y="444" font-size="13" fill="#475569">bản dự phòng ngoài nhà cung cấp —</text>
  <text x="1220" y="464" font-size="13" fill="#475569">VPS mất là dựng lại được từ đây</text>
  <line x1="1174" y1="440" x2="1196" y2="440" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mb)"/>
  <path d="M 875 445 L 810 445 L 810 518 L 774 518" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mb)"/>
  <text x="820" y="480" font-size="12.5" fill="#78350f">kéo về (không cần mở cổng ở trường)</text>
  <text x="880" y="536" font-size="13" font-style="italic" fill="#78350f">Đủ nguyên tắc 3-2-1: bản chính trên VPS + bản sao trên VPS + bản kéo về trường.</text>

  <!-- ============ GITHUB + CẬP NHẬT ============ -->
  <rect x="850" y="610" width="670" height="180" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
  <text x="880" y="648" font-size="21" font-weight="bold" fill="#0f172a">GITHUB — KHO MÃ NGUỒN (công khai)</text>
  <text x="880" y="672" font-size="13.5" fill="#475569">chỉ mã + 655 bài kiểm thử; 4 lớp canh bảo đảm không bao giờ chứa dữ liệu học sinh</text>
  <rect x="880" y="688" width="610" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
  <text x="900" y="716" font-size="14.5" font-weight="bold" fill="#0f172a">CI tự chạy đủ kiểm thử mỗi lần đẩy mã — đỏ là biết phiên bản có vấn đề</text>
  <text x="900" y="740" font-size="13" fill="#475569">chỉ cập nhật VPS khi CI đang xanh</text>

  <rect x="40" y="680" width="760" height="210" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5"/>
  <text x="70" y="718" font-size="21" font-weight="bold" fill="#075985">CẬP NHẬT APP — qua SSH, khi có phiên bản mới</text>
  <rect x="70" y="738" width="160" height="84" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="88" y="766" font-size="14.5" font-weight="bold" fill="#0f172a">① ssh vào VPS</text>
  <text x="88" y="790" font-size="12" fill="#475569">rồi cd /opt/schoolconnect</text>
  <rect x="258" y="738" width="150" height="84" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="276" y="766" font-size="14.5" font-weight="bold" fill="#0f172a">② git pull</text>
  <text x="276" y="790" font-size="12" fill="#475569">chỉ tải mã về</text>
  <rect x="436" y="738" width="150" height="84" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="454" y="766" font-size="14.5" font-weight="bold" fill="#0f172a">③ npm test</text>
  <text x="454" y="790" font-size="12" fill="#475569">xanh hết mới bước ④</text>
  <rect x="614" y="738" width="160" height="84" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="630" y="760" font-size="13.5" font-weight="bold" fill="#0f172a">④ systemctl restart</text>
  <text x="630" y="780" font-size="13.5" font-weight="bold" fill="#0f172a">schoolconnect</text>
  <text x="630" y="802" font-size="12" fill="#475569">gián đoạn vài giây</text>
  <line x1="230" y1="780" x2="254" y2="780" stroke="#334155" stroke-width="2.2" marker-end="url(#mb)"/>
  <line x1="408" y1="780" x2="432" y2="780" stroke="#334155" stroke-width="2.2" marker-end="url(#mb)"/>
  <line x1="586" y1="780" x2="610" y2="780" stroke="#334155" stroke-width="2.2" marker-end="url(#mb)"/>
  <path d="M 846 700 L 810 700 L 810 780 L 778 780" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mb)"/>
  <text x="70" y="862" font-size="13" font-style="italic" fill="#075985">Bước ③ đỏ thì DỪNG — app đang chạy vẫn là bản cũ tốt. Dữ liệu không bị git pull đụng tới.</text>

  <!-- ============ CHÚ GIẢI ============ -->
  <line x1="70" y1="950" x2="130" y2="950" stroke="#334155" stroke-width="2.4" marker-end="url(#mb)"/>
  <text x="145" y="955" font-size="14" fill="#0f172a">luồng hằng ngày, tự động</text>
  <line x1="400" y1="950" x2="460" y2="950" stroke="#334155" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#mb)"/>
  <text x="475" y="955" font-size="14" fill="#0f172a">định kỳ / khi có việc</text>
  <text x="790" y="955" font-size="13" font-style="italic" fill="#64748b">Nguồn: docs/so-do-trien-khai-vps.svg — sửa xong chạy `npm run tai-lieu:quy-trinh` để tài liệu Word nhận hình mới.</text>
</svg>
