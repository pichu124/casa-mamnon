name: Kiểm tra

# Chạy mỗi lần đẩy mã lên hoặc mở pull request. Đây là lớp canh cuối: móc git ở
# máy cá nhân bỏ qua được bằng `git commit --no-verify`, còn lớp này thì không.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  du-lieu:
    name: Không có dữ liệu của trường trong kho mã
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lớp chặn cuối. Móc git ở máy cá nhân bỏ qua được bằng --no-verify,
      # còn lớp này thì không. Xét cả các commit vừa đẩy lên lẫn toàn bộ cây
      # tệp hiện tại, phòng khi dữ liệu lọt vào từ một đường khác.
      - name: Kiểm tra các commit mới
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            KHOANG="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            KHOANG="${{ github.event.before }}..${{ github.sha }}"
          else
            KHOANG="${{ github.sha }}~1..${{ github.sha }}"
          fi
          node scripts/kiem-tra-du-lieu.js --khoang "$KHOANG"

      - name: Kiểm tra toàn bộ tệp đang được theo dõi
        run: git ls-files | xargs node scripts/kiem-tra-du-lieu.js --tep

  commit-rieng:
    name: Sửa tệp dùng chung phải là commit riêng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần đủ lịch sử để biết những commit nào là mới

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kiểm tra từng commit mới
        run: |
          # Trên pull request thì xét các commit chưa có ở nhánh đích.
          # Trên push thì xét các commit vừa đẩy lên.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            KHOANG="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            KHOANG="${{ github.event.before }}..${{ github.sha }}"
          else
            # Nhánh mới tạo: chỉ xét commit trên cùng.
            KHOANG="${{ github.sha }}~1..${{ github.sha }}"
          fi
          echo "Khoảng kiểm tra: $KHOANG"
          node scripts/kiem-tra-commit.js --khoang "$KHOANG"

  sw-version:
    name: Đổi public/ thì phải tăng VERSION của service worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần đủ lịch sử để biết những commit nào là mới

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Không tăng VERSION thì điện thoại đã cài app chạy mãi bản cũ, và không
      # ai tái hiện được vì máy của người sửa chưa cài app.
      #
      # Xét CẢ KHOẢNG như một đơn vị, không xét từng commit: quy định commit
      # riêng bắt tách một đợt việc làm hai ba commit, và chỉ một trong số đó
      # tăng VERSION. Thứ đi tới máy của cô là trạng thái cuối khoảng.
      # SO VỚI NHÁNH CHÍNH, KHÔNG SO VỚI LẦN PUSH TRƯỚC.
      #
      # `CLAUDE.md` hứa: "Bộ canh so với NHÁNH CHÍNH, không so với commit ngay
      # trước — cả nhánh chỉ cần tăng một lần là đủ." Job này thì so với lần
      # push trước (`github.event.before`), nên một nhánh ĐÃ tăng VERSION ở lần
      # push đầu vẫn bị báo đỏ ở lần push thứ hai nếu lần đó có đụng `public/`.
      #
      # Người gặp cảnh đó sẽ tăng VERSION thêm một lần nữa cho qua — mà mỗi lần
      # tăng là một lần xoá kho đệm của mọi điện thoại đã cài app. Hoặc tệ hơn:
      # họ thêm dòng `Khong-can-sw:` cho quen tay.
      #
      # Ba trường hợp, mỗi cái một mốc đúng:
      #   • pull request → so với nhánh đích (đang đúng sẵn);
      #   • push thẳng vào `main` → so với lần push trước, vì với main thì lần
      #     push trước CHÍNH LÀ thứ đã tới máy của cô;
      #   • push vào nhánh khác → so với điểm rẽ khỏi `main`.
      - name: Kiểm tra khoảng commit mới
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            KHOANG="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ] \
               && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            KHOANG="${{ github.event.before }}..${{ github.sha }}"
          else
            git fetch --no-tags --depth=0 origin main 2>/dev/null || git fetch --no-tags origin main
            MOC="$(git merge-base "${{ github.sha }}" origin/main 2>/dev/null || true)"
            if [ -n "$MOC" ]; then
              KHOANG="$MOC..${{ github.sha }}"
            elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
              KHOANG="${{ github.event.before }}..${{ github.sha }}"
            else
              KHOANG="${{ github.sha }}~1..${{ github.sha }}"
            fi
          fi
          echo "Khoảng kiểm tra: $KHOANG"
          node scripts/kiem-tra-sw.js --khoang "$KHOANG"

  kiem-thu:
    name: Kiểm thử (không cần trình duyệt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  kiem-thu-giao-dien:
    name: Kiểm thử giao diện (Chromium thật)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium
      - name: Chạy kiểm thử giao diện
        # Playwright tự tìm trình duyệt vừa cài, không dùng đường dẫn cố định.
        run: CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run test:giao-dien
